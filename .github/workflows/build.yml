name: Build Vantage PMS

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: vantage-pms-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/Vantage.PMS.Tests/Vantage.PMS.Tests.csproj

      - name: Build
        run: dotnet build Vantage.PMS.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Vantage.PMS.Tests/Vantage.PMS.Tests.csproj --configuration Release --no-restore

      - name: Upload desktop QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qa
          path: artifacts/desktop-qa
          if-no-files-found: ignore

      - name: Sign in to Azure with OpenID Connect
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/login@v2
        with:
          client-id: 5b0a983c-ea87-4f71-8afb-6a1d5abcf55d
          tenant-id: fb7a0ae4-40f7-4301-844a-424d541a97e1
          subscription-id: f65c5c48-4b2f-4d08-bc8a-ab3aea6f751d

      - name: Publish deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish Vantage.PMS.csproj --configuration Release --no-restore --output ./publish

      - name: Deploy to Vantage PMS production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/webapps-deploy@v3
        with:
          app-name: vantage-pms-ph
          package: ./publish
